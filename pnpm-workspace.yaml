packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'

# pnpm 10+/11 blocks lifecycle (build) scripts by default. Explicitly allow the
# native/codegen packages we trust to run their install/postinstall scripts.
# (In pnpm 11 this is the `allowBuilds` map — the old `onlyBuiltDependencies`
# list in package.json is no longer read.)
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  argon2: true
  # Next.js optional image-optimization dep; the dashboard uses no next/image,
  # so its native build is not needed.
  sharp: false

minimumReleaseAgeExclude:
  - '@next/env@16.2.10'
  - '@next/swc-darwin-arm64@16.2.10'
  - '@next/swc-darwin-x64@16.2.10'
  - '@next/swc-linux-arm64-gnu@16.2.10'
  - '@next/swc-linux-arm64-musl@16.2.10'
  - '@next/swc-linux-x64-gnu@16.2.10'
  - '@next/swc-linux-x64-musl@16.2.10'
  - '@next/swc-win32-arm64-msvc@16.2.10'
  - '@next/swc-win32-x64-msvc@16.2.10'
  - next@16.2.10
